<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | YouthCraft</title>
<meta name="description" content="Reset your YouthCraft password to regain access to your health tracking dashboard and daily habit insights.">
<link rel="stylesheet" href="styles.css">
<style>
:root{--yc-ink:#183b32;--yc-green:#176b55;--yc-mint:#e8f3ed;--yc-paper:#fbfaf6;--yc-line:#dce7df;--yc-muted:#5b7068;--yc-gold:#c48a39;--yc-lilac:#eeeafb}
*{box-sizing:border-box}
body{margin:0;background:var(--yc-paper);color:#243b33}
.wrap{max-width:1160px;margin:auto;padding:0 22px}

/* Page Layout */
.auth-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 84% 12%,#d9eee2 0,transparent 27%),radial-gradient(circle at 8% 92%,#f7e9ce 0,transparent 24%),linear-gradient(130deg,#f5f8f1,#e8f3ed);padding:60px 0 40px;border-bottom:1px solid var(--yc-line);text-align:center}
.eyebrow{letter-spacing:.15em;text-transform:uppercase;font-size:.76rem;font-weight:850;color:var(--yc-green)}
.auth-hero h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;color:var(--yc-ink);margin:12px 0;letter-spacing:-.045em}
.auth-hero p{font-size:1.08rem;line-height:1.6;color:#466157;margin:0 auto;max-width:560px}

.content{padding-top:40px;padding-bottom:72px}
.auth-card{max-width:480px;margin:0 auto;background:white;border:1px solid var(--yc-line);border-radius:24px;padding:36px;box-shadow:0 8px 24px rgba(24,59,50,.035)}

/* Form Elements */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.92rem;font-weight:750;color:var(--yc-ink);margin-bottom:8px}
.form-control{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--yc-line);background:#fafcfb;color:var(--yc-ink);font-size:1rem;font-family:inherit;transition:border-color .18s,box-shadow .18s}
.form-control:focus{outline:none;border-color:var(--yc-green);background:white;box-shadow:0 0 0 3px rgba(23,107,85,.12)}

/* Actions */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;text-decoration:none;border-radius:999px;padding:14px 20px;font-size:1rem;font-weight:800;background:var(--yc-green);color:white;border:1px solid var(--yc-green);cursor:pointer;transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #183b321a}
.btn:focus-visible{outline:3px solid #e3b45e;outline-offset:3px}

.auth-footer-link{text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--yc-line);font-size:.92rem;color:var(--yc-muted)}
.auth-footer-link a{color:var(--yc-green);text-decoration:none;font-weight:700}
.auth-footer-link a:hover{text-decoration:underline}

@media(max-width:560px){
  .auth-hero{padding:44px 0 30px}
  .auth-card{padding:24px;border-radius:20px}
}
</style>
</head>
<body>

<!-- Dynamic Header Slot -->
<div id="site-header"></div>

<!-- Hero Header -->
<header class="auth-hero">
  <div class="wrap">
    <div class="eyebrow">✦ Account Recovery</div>
    <h1>Forgot Your Password?</h1>
    <p>No worries! Enter your registered email address below and we'll send you instructions to reset your password.</p>
  </div>
</header>

<!-- Main Content -->
<main class="wrap content">
  <div class="auth-card">
    <form action="verify.html" method="POST" id="forgotPasswordForm">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn">Send Reset Link <span aria-hidden="true">→</span></button>

      <!-- Return to Login Link -->
      <div class="auth-footer-link">
        Remembered your password? <a href="login.html">Log in here</a>
      </div>

    </form>
  </div>
</main>

<!-- Dynamic Footer Slot -->
<div id="site-footer"></div>

<!-- Shared Script -->
<script src="script.js"></script>
</body>
</html>
