31.89], "a": "Obey limits, use hands-free, avoid driving tired", "t": "Speeding / distracted driving and crash mortality risk", "u": "https://pubmed.ncbi.nlm.nih.gov/"}, {"id": "Q175", "c": "Environment & preventive care", "s": "Head / Injury", "k": "Preventive & Environment", "q": "Do you wear a helmet when cycling or riding a motorbike?", "d": "Injury (driver)", "m": "Tier 1: Manual Input (Simple)", "o": ["Not applicable", "Always", "Usually", "Sometimes", "Never"], "l": [0, 0, 45, 97.5, 150], "r": [0, 0, 36.85, 79.84, 122.84], "a": "Always wear a certified helmet", "t": "Helmet use and head injury / mortality in cycling / motorcycling", "u": "https://pubmed.ncbi.nlm.nih.gov/"}, {"id": "Q176", "c": "Environment & preventive care", "s": "Musculoskeletal", "k": "Preventive & Environment", "q": "How many fall hazards are in your home (loose rugs, poor lighting, clutter)?", "d": "Fall-related fractures (driver)", "m": "Tier 2: Manual Input (Detailed)", "o": ["None", "One", "Two to three", "Four or more"], "l": [0, 30, 65, 100], "r": [0, 19.78, 42.86, 65.94], "a": "Remove hazards, add lighting and handrails", "t": "Home fall hazards and fall-related mortality / injury", "u": "https://pubmed.ncbi.nlm.nih.gov/"}, {"id": "Q182", "c": "Environment & preventive care", "s": "Eye", "k": "Preventive & Environment", "q": "When was your last eye examination?", "d": "Glaucoma / macular degeneration detection (driver)", "m": "Tier 1: Manual Input (Simple)", "o": ["Within the past 2 years", "2 to 5 years ago", "More than 5 years ago", "Never"], "l": [0, 39, 45, 60], "r": [0, 30.39, 35.07, 46.76], "a": "Eye exam every 1-2 years (more often if over 60)", "t": "Eye examination frequency and vision preservation / accident risk", "u": "https://pubmed.ncbi.nlm.nih.gov/"}, {"id": "Q183", "c": "Environment & preventive care", "s": "Whole body", "k": "Preventive & Environment", "q": "Do you take prescribed medicines as directed?", "d": "Treatment effectiveness (driver)", "m": "Tier 1: Manua "https://pubmed.ncbi.nlm.nih.gov/"}, {"id": "Q200", "c": "Lifestyle: Mind & social", "s": "Brain", "k": "Social / Mind", "q": "Do you feel in control of your health choices and daily routines?", "d": "Chronic stress / self-efficacy (driver)", "m": "Tier 2: Manual Input (Detailed)", "o": ["Always", "Usually", "Sometimes", "Never"], "l": [0, 45, 97.5, 150], "r": [0, 12.6, 27.3, 42], "a": "Set small achievable health goals and track progress", "t": "Perceived control / self-efficacy over health and mortality / health behaviour pathways", "u": "https://pubmed.ncbi.nlm.nih.gov/"}]};
const cats=DATA.cats, qs=DATA.qs, KEY='yc_recurring_answers_v1';
let ans={}, cur=0;
try{ans=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ans={}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'';
const byCat=cats.map(c=>qs.filter(q=>q.c===c));
const answeredIn=i=>byCat[i].filter(q=>ans[q.id]).length;
function save(){try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}}
const Adherence_Factor=0.5;
const fmt=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:1});
const qmap={};qs.forEach(q=>qmap[q.id]=q);
function info(q){const v=ans[q.id];if(!v||!q.o[v-1])return '';const k=v-1;
  if(/^not tested/i.test(q.o[k]))return '<div class="nt"><b>Get this tested.</b> Without a result we cannot tell how many Life-days you could reclaim here, so please take the relevant test and update your answer.</div>';
  const rc=q.r[k];if(!rc)return '';
  return `<div class="reclaim"><span class="lbl">Reclaim Lifedays to the tune of</span><b class="num">${fmt(q.l[k])}</b><span class="u">Life-days</span><span class="sep">|</span><span class="lbl">Reclaim upto</span><b class="num">${fmt(rc*Adherence_Factor)}</b><span class="u">Life-days</span></div>`+(q.a?`<div class="mission"><b>Mission:</b> ${esc(q.a)}</div>`:'');}
function renderTotal(){let n=0,t=0;qs.forEach(q=>{const v=ans[q.id];if(v&&q.r[v-1]){n++;t+=q.r[v-1]*Adherence_Factor}});
  $('total').innerHTML=n?`You can reclaim a total of <b>${fmt(Math.round(t))} Life-days (${(t/365.25).toFixed(2)} years)</b>, just by taking remedial action.`:'Answer the questions below to see how many Life-days you can reclaim by taking remedial action.';}
function renderTabs(){
  $('tabs').innerHTML=cats.map((c,i)=>{const a=answeredIn(i),t=byCat[i].length;
    return `<button type="button" role="tab" class="tab${a===t?' done':''}" aria-selected="${i===cur}" data-i="${i}">${esc(c)}<span class="n">${a}/${t}</span></button>`}).join('');
}
function renderOverall(){
  const a=Object.keys(ans).filter(k=>ans[k]).length;
  $('ovCount').textContent=a+' of '+qs.length+' answered';
  $('ovPct').textContent=Math.round(a/qs.length*100)+'%';
  $('barFill').style.width=(a/qs.length*100)+'%';
  $('bar').setAttribute('aria-valuenow',a);
}
function renderPanel(){
  const list=byCat[cur];
  $('panel').innerHTML=`<div class="cat-head"><h2>${esc(cats[cur])}</h2><p>Category ${cur+1} of ${cats.length} · ${list.length} questions</p></div>`+
  list.map((q,n)=>{
    const opts=q.o.map((t,k)=>`<option value="${k+1}"${ans[q.id]==k+1?' selected':''}>${esc(t)}</option>`).join('');
    const u=safeUrl(q.u);
    const ref=q.t?(u?`<span class="refwrap"><span class="refpre">Refer:</span> <a class="ref" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(q.t)}</a></span>`:`<span class="refl"><span class="refpre">Refer:</span> ${esc(q.t)}</span>`):'';
    return `<div class="q-item"><div class="tags"><span class="tag sys">${esc(q.s)}</span><span class="tag clu">${esc(q.k)}</span>${q.d?`<span class="tag dd">${esc(q.d)}</span>`:''}</div>
<div class="q-text">${n+1}. ${esc(q.q)}</div><div class="daa">Input mode: ${esc(q.m)}</div>
<select data-id="${q.id}" aria-label="${esc(q.q)}" class="${ans[q.id]?'has':''}"><option value="">Select an answer</option>${opts}</select><div class="info" id="info-${q.id}">${info(q)}</div>${ref}</div>`}).join('')+
  `<div class="form-actions"><button type="button" class="btn btn-secondary" id="prev"${cur===0?' disabled':''}>← Previous</button>
<button type="button" class="btn btn-primary" id="next">${cur===cats.length-1?'Save Responses ✓':'Next: '+esc(cats[cur+1])+' →'}</button></div>`;
}
function go(i){cur=Math.max(0,Math.min(cats.length-1,i));renderTabs();renderPanel();
  const t=document.querySelector('.tab[aria-selected=true]');if(t)t.scrollIntoView({inline:'center',block:'nearest'});
  window.scrollTo({top:$('tabs').offsetTop-8,behavior:'smooth'});}
function submitAssessment(){
  const left=qs.length-Object.keys(ans).filter(k=>ans[k]).length;
  if(left&&!confirm(left+' question(s) are still unanswered. Save anyway?'))return;
  alert('Your responses have been saved on this device.');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(+b.dataset.i)});
$('panel').addEventListener('change',e=>{const s=e.target.closest('select[data-id]');if(!s)return;
  if(s.value)ans[s.dataset.id]=+s.value;else delete ans[s.dataset.id];
  s.classList.toggle('has',!!s.value);const iv=$('info-'+s.dataset.id);if(iv)iv.innerHTML=info(qmap[s.dataset.id]);save();renderOverall();renderTotal();renderTabs();});
$('panel').addEventListener('click',e=>{
  if(e.target.id==='prev')go(cur-1);
  if(e.target.id==='next'){cur===cats.length-1?submitAssessment():go(cur+1)}});
renderOverall();renderTotal();renderTabs();renderPanel();
</script>
